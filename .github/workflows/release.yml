name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0). Leave empty to use package.json version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package plugin zip
        run: |
          STAGE="decky-recents-filter"
          rm -rf "$STAGE" decky-recents-filter.zip
          mkdir -p "$STAGE/dist"
          cp plugin.json package.json main.py README.md LICENSE* "$STAGE/" 2>/dev/null || true
          cp -r dist/index.js "$STAGE/dist/"
          # Optional assets
          [ -f dist/index.js.map ] && cp dist/index.js.map "$STAGE/dist/" || true
          zip -r decky-recents-filter.zip "$STAGE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Recents Filter ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: decky-recents-filter.zip
          fail_on_unmatched_files: true
